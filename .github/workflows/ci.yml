name: Data Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: data_quality
          POSTGRES_USER: dq_user
          POSTGRES_PASSWORD: dq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
